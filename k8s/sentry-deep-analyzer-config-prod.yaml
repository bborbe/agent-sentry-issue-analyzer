# Config CRD instance for the deep Sentry bug analyzer (sentry-deep-analyzer
# task type, same binary as the triage agent). The triage execution phase
# reassigns a task to this assignee on a `verdict: real bug`, and the executor
# routes it here — one deep run per flagged alert, never batch.
# Apply with: kubectlnukeprod -n prod apply -f k8s/sentry-deep-analyzer-config.yaml

apiVersion: agent.benjamin-borbe.de/v1
kind: Config
metadata:
  name: sentry-deep-analyzer
  namespace: prod
spec:
  assignee: sentry-deep-analyzer
  image: docker.prod.nuke.benjamin-borbe.de:443/agent-sentry-issue-analyzer:prod
  heartbeat: 5m
  maxConcurrentJobs: 1
  priorityClassName: agent-sentry-issue-analyzer

  taskTypes:
    - sentry-deep-analyzer
    - healthcheck

  trigger:
    phases:
      - planning
      - execution
    statuses:
      - in_progress

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    ALLOWED_TOOLS: "Bash(scripts/sentry-read.sh:*),Bash(scripts/repo-clone.sh:*),Read,Edit,Grep"
    ANTHROPIC_BASE_URL: "http://claude-code-router-prod:8788"
    ANTHROPIC_MODEL: "MiniMax-M2.7-highspeed"
    CLAUDE_CONFIG_DIR: "/home/claude/.claude"
    LOGLEVEL: "2"
    # GitHub App auth for read-only cloning of private repos (repo-clone.sh).
    # Per the fleet standard (github-releaser pattern), the deep analyzer gets
    # its OWN dedicated GitHub App family (dev + prod) — NOT the shared reviewer
    # App. PEM_KEY comes from the mounted secret (agent-sentry-issue-analyzer)
    # and is minted to an IAT at startup. APP_ID/INSTALLATION_ID are public
    # values (safe in manifests); the PEM is secret, in teamvault → secret.
    # Prod App: "Ben's Sentry Deep Analyzer" (installed on bborbe/*).
    APP_ID: "4710998"
    INSTALLATION_ID: "156399409"

  secretName: agent-sentry-issue-analyzer

  volumeClaim: agent-sentry-issue-analyzer
  volumeMountPath: /home/claude/.claude
