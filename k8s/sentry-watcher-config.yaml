# Config CRD instance for the sentry-watcher agent step (sentry-watcher task
# type, same binary as the triage agent). The daily recurring trigger creates
# one sentry-watcher task; the agent runs scripts/sentry-create-tasks.sh to
# fetch the day's active unresolved Sentry alerts and publishes one per-alert
# task per (short-id, date) via /create-tasks so the triage agent
# (sentry-issue-analyzer) processes each. Replaces the retired standalone
# sentry-watcher service.
# Apply with: kubectlnukedev -n dev apply -f k8s/sentry-watcher-config.yaml

apiVersion: agent.benjamin-borbe.de/v1
kind: Config
metadata:
  name: sentry-watcher
  namespace: dev
spec:
  assignee: sentry-watcher
  image: docker.prod.nuke.benjamin-borbe.de:443/agent-sentry-issue-analyzer:dev
  heartbeat: 5m
  maxConcurrentJobs: 1
  priorityClassName: agent-sentry-issue-analyzer

  taskTypes:
    - sentry-watcher
    - healthcheck

  trigger:
    phases:
      - planning
    statuses:
      - in_progress

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    ALLOWED_TOOLS: "Bash(scripts/sentry-create-tasks.sh:*)"
    ANTHROPIC_BASE_URL: "http://claude-code-router-dev:8788"
    ANTHROPIC_MODEL: "MiniMax-M2.7-highspeed"
    CLAUDE_CONFIG_DIR: "/home/claude/.claude"
    LOGLEVEL: "2"
    # KAFKA_BROKERS is injected by the executor (repo convention: broker list
    # comes from common.env / the executor, not the Config CR env) — the
    # watcher script receives it in the subprocess env via buildClaudeEnv.
    # TARGET_VAULT / STAGE default in scripts/sentry-create-tasks.sh
    # (personal / dev) and can be overridden here if needed.

  secretName: agent-sentry-issue-analyzer

  volumeClaim: agent-sentry-issue-analyzer
  volumeMountPath: /home/claude/.claude
